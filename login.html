<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - GameZone</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>GAMEZONE</h1>
        <p>Inicio de sesión</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="registro.html">Registrarse</a>
        <a href="login.html">Iniciar sesión</a>
    </nav>

    <main>

        <section class="contenedor-formulario login">

            <h2>Iniciar sesión</h2>

            <form id="formularioLogin" novalidate>

                <div class="campo">
                    <label for="correoLogin">Correo electrónico</label>

                    <input
                        type="email"
                        id="correoLogin"
                        name="correoLogin"
                        autocomplete="email"
                        placeholder="usuario@duoc.cl">

                    <p class="error" id="errorCorreoLogin"></p>
                </div>

                <div class="campo">
                    <label for="contrasenaLogin">Contraseña</label>

                    <input
                        type="password"
                        id="contrasenaLogin"
                        name="contrasenaLogin"
                        autocomplete="current-password"
                        placeholder="Ingresa tu contraseña">

                    <p class="error" id="errorContrasenaLogin"></p>
                </div>

                <button type="submit">Iniciar sesión</button>

                <p class="mensaje-exito" id="mensajeLogin"></p>

            </form>

            <p class="enlace-formulario">
                ¿Todavía no tienes una cuenta?
                <a href="registro.html">Regístrate aquí</a>
            </p>

        </section>

    </main>

    <footer>
        <p>GameZone - Vanessa Golle y Carolina Andrade</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
